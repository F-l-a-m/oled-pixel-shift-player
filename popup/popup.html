<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLED Pixel Shift Player</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <button id="start">
        <span>Start / stop OLED mode</span>
    </button>
    <p id="status" role="status"></p>
    <details>
        <summary>Settings</summary>
        <form id="settings">
            <label>Minimum scale <input name="scaleMin" type="number" min="0.1" max="1" step="0.01" value="0.63"></label>
            <label>Maximum scale <input name="scaleMax" type="number" min="0.1" max="1" step="0.01" value="0.70"></label>
            <label>Safety margin (%) <input name="safetyMarginPct" type="number" min="0" max="20" step="0.1" value="3"></label>
            <label>X duration (s) <input name="durationXs" type="number" min="1" max="3600" value="53"></label>
            <label>Y duration (s) <input name="durationYs" type="number" min="1" max="3600" value="71"></label>
            <label>Scale duration (s) <input name="durationScaleS" type="number" min="1" max="3600" value="97"></label>
        </form>
    </details>

    <script src="../shared-constants.js"></script>
    <script src="../shared-background.js"></script>
    <script src="popup.js"></script>
</body>
</html>
